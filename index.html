<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VuvEnDod | Визитка</title>
    <style>
        /* =========================================
           НАСТРОЙКИ ФОНА ВОКРУГ РАМКИ (body)
           ========================================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Меняй этот цвет, чтобы изменить фон всей страницы */
            background-color: #121212; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* =========================================
           НАСТРОЙКИ САМОЙ РАМКИ (frame)
           ========================================= */
        .frame {
            /* Цвет фона самой рамки */
            background-color: #1e1e1e; 
            
            /* Внутренние отступы (чтобы текст не прилипал к краям) */
            padding: 40px;
            
            /* Закругление углов */
            border-radius: 20px; 
            
            /* Тень для объема (первые два значения - сдвиг, третье - размытие, четвертое - прозрачность) */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); 
            
            /* Размеры рамки */
            max-width: 600px;
            width: 100%;
            text-align: center;
            
            /* =========================================
               НАСТРОЙКИ ГРАНИЦЫ (Бордюра)
               ========================================= */
            /* Толщина | Стиль (solid, dashed, dotted) | Цвет */
            border: 4px solid #bb86fc; 

            /* =========================================
               КАК ДОБАВИТЬ КАРТИНКУ НА ФОН РАМКИ
               (Уберите звездочки /* и */ чтобы включить)
               ========================================= */
            /*
            background-image: url('https://example.com/ваша-картинка.jpg');
            background-size: cover;
            background-position: center;
            */
        }

        /* Цвета текста внутри рамки */
        h1 { 
            margin-top: 0;
            color: #ffffff; 
        }
        p { 
            color: #a0a0a0; 
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Это и есть наша рамка -->
    <div class="frame">
        <h1>Привет, мир!</h1>
        <p>Это мой первый сайт на GitHub Pages. Теперь у меня есть стильная рамка, которую я могу кастомизировать как угодно!</p>
    </div>

</body>
</html>
