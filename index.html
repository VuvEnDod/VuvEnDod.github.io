<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой сайт - Скрапбук</title>
<style>
  /* ===== ОБЩИЕ НАСТРОЙКИ ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4; /* Единый фон всей страницы (можно поменять) */
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 10px; /* Отступ от краев экрана */
    gap: 10px;     /* Расстояние между шапкой и основным блоком */
  }

  /* ===== ВЕРХНЯЯ ПАНЕЛЬ (ШАПКА) ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 4px solid #000;
    background: #fff;
    padding: 10px 20px;
    height: 80px; /* Фиксированная высота шапки */
  }

  /* Контейнер для 4 кнопок */
  .top-buttons {
    display: flex;
    gap: 15px;
  }

  /* Стили самих кнопок */
  .top-buttons button {
    border: 4px solid #000;
    background: #fff;
    padding: 10px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }

  .top-buttons button:hover {
    background: #ddd;
  }

  /* Текст справа в шапке */
  .top-text {
    font-size: 14px;
    text-align: right;
    max-width: 250px;
    line-height: 1.4;
  }

  /* ===== ОСНОВНАЯ СТРУКТУРА (3 КОЛОНКИ) ===== */
  .main-layout {
    display: grid;
    /* 1fr 2fr 1fr — центральная колонка в 2 раза шире боковых */
    grid-template-columns: 1fr 2fr 1fr; 
    flex: 1; /* Занимает всё оставшееся место до низа */
    border: 4px solid #000;
    background: #fff;
  }

  /* Общие стили для всех трех колонок */
  .main-layout > div {
    padding: 20px;
  }

  /* Левая колонка (Бекграунд) */
  .left-sidebar {
    border-right: 4px solid #000;
    background: #e8e8e8; /* Здесь можно поставить картинку или цвет */
  }

  /* Центральная колонка (Лента) */
  .feed {
    text-align: center;
    background: #fff; /* Фон ленты */
    overflow-y: auto; /* Если контента много — появится скролл */
  }

  /* Правая колонка (Бекграунд) */
  .right-sidebar {
    border-left: 4px solid #000;
    background: #e8e8e8; /* Здесь можно поставить картинку или цвет */
  }

  /* ===== АДАПТИВ ДЛЯ ТЕЛЕФОНОВ ===== */
  @media (max-width: 768px) {
    .top-bar {
      flex-direction: column;
      height: auto;
      gap: 15px;
      padding: 15px;
    }
    .top-text {
      text-align: center;
      max-width: 100%;
    }
    .top-buttons {
      flex-wrap: wrap;
      justify-content: center;
    }
    /* На телефонах колонки встают друг под друга */
    .main-layout {
      grid-template-columns: 1fr;
    }
    .left-sidebar, .right-sidebar {
      border: none;
      border-bottom: 4px solid #000;
      min-height: 150px;
    }
  }
</style>
</head>
<body>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="top-bar">
    <div class="top-buttons">
      <button>Кнопка 1</button>
      <button>Кнопка 2</button>
      <button>Кнопка 3</button>
      <button>Кнопка 4</button>
    </div>
    <div class="top-text">
      Кнопки по типу credit, info, gallery, music, vids
    </div>
  </header>

  <!-- ОСНОВНОЙ БЛОК С 3 КОЛОНКАМИ -->
  <main class="main-layout">
    
    <!-- Левая колонка -->
    <div class="left-sidebar">
      1. Бекграунд
    </div>

    <!-- Центральная лента -->
    <div class="feed">
      <h2>Главная лента скрапбука</h2>
      <p>Здесь будет ваш контент...</p>
      <!-- Сюда можно добавлять посты, картинки и т.д. -->
    </div>

    <!-- Правая колонка -->
    <div class="right-sidebar">
      1. Бекграунд
    </div>

  </main>

</body>
</html>
